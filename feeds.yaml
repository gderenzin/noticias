# Lista blanca (allowlist) de fuentes RSS verificadas.
#
# Esta es la ÚNICA lista de fuentes permitida por scripts/fetch_news.py.
# Nunca se agregan noticias desde ningún otro origen.
#
# Campos de cada fuente:
#   nombre   -> nombre para mostrar en el sitio
#   url      -> URL del feed RSS/Atom
#   dominio  -> dominio "oficial" de los artículos de esta fuente. Se usa para
#               verificar que el enlace de cada noticia realmente pertenece a
#               esta fuente antes de publicarla (ver fetch_news.py). Nótese que
#               para "The Hacker News" el feed se sirve vía Feedburner, pero los
#               artículos enlazan a thehackernews.com — por eso el dominio de
#               verificación es el del artículo, no el del feed.
#   idioma   -> "en" o "es". Además de ser informativo, si es "es" el sitio
#               NO manda el título/extracto a traducir con DeepL (ya está en
#               español) -- ver preparar_texto_mostrado() en build_site.py.
#   opcional -> si es "true" y el feed falla la validación, se elimina de esta
#               lista y se documenta en README.md en vez de romper el proceso
#   categoria -> (opcional) fija la categoría de TODOS los ítems de esta
#               fuente directamente, en vez de inferirla por palabras clave
#               del título/extracto (ver categorizar() en build_site.py).
#               Se usa para fuentes de un solo tema, como la sección de
#               Protección de Datos (categoria: proteccion_datos).
#   filtro_palabras_clave -> (opcional) lista de palabras/frases; si se
#               declara, un ítem de esta fuente SOLO se publica si su
#               título o extracto contiene alguna de ellas (sin distinguir
#               mayúsculas/minúsculas) -- para fuentes que cubren varios
#               temas y de las que solo interesa una parte (p.ej. un
#               despacho legal generalista del que solo se quiere lo
#               referido a protección de datos).

fuentes:
  - nombre: "The Hacker News"
    url: "https://feeds.feedburner.com/TheHackersNews"
    dominio: "thehackernews.com"
    idioma: en

  - nombre: "BleepingComputer"
    url: "https://www.bleepingcomputer.com/feed/"
    dominio: "bleepingcomputer.com"
    idioma: en

  - nombre: "Krebs on Security"
    url: "https://krebsonsecurity.com/feed/"
    dominio: "krebsonsecurity.com"
    idioma: en

  - nombre: "Dark Reading"
    url: "https://www.darkreading.com/rss.xml"
    dominio: "darkreading.com"
    idioma: en

  - nombre: "WeLiveSecurity (ESET) en español"
    url: "https://www.welivesecurity.com/es/rss/feed/"
    dominio: "welivesecurity.com"
    idioma: es

  - nombre: "INCIBE-CERT - Avisos"
    url: "https://www.incibe.es/incibe-cert/alerta-temprana/avisos/feed"
    dominio: "incibe.es"
    idioma: es
    opcional: true

  # --- Sección "Protección de Datos" (ver README: "Segunda sección...") ---

  - nombre: "dpoec.com"
    url: "https://dpoec.com/feed/"
    dominio: "dpoec.com"
    idioma: es
    categoria: proteccion_datos

  - nombre: "CorralRosales"
    url: "https://corralrosales.com/feed/"
    dominio: "corralrosales.com"
    idioma: es
    categoria: proteccion_datos
    # CorralRosales es un despacho legal generalista (cubre minería, laboral,
    # tributario, etc.) -- solo se publican sus ítems que mencionen protección
    # de datos; el resto se descarta (ver filtro_palabras_clave en fetch_news.py).
    filtro_palabras_clave:
      - "protección de datos"
      - "proteccion de datos"
      - "datos personales"
      - "LOPDP"
      - "privacidad"
      - "DPD"
      - "DPO"

  # La Superintendencia de Protección de Datos Personales (SPDP, el ente
  # rector de la LOPDP en Ecuador) NO tiene RSS funcional -- se confirmó
  # que /feed/, /prensa/feed/ y los sitemaps están vacíos o son feeds de
  # comentarios. Por eso no aparece acá como fuente RSS: sus boletines de
  # prensa se traen aparte, vía scripts/fetch_spdp.py, que descarga el
  # endpoint JSON oficial de WordPress de la página "Prensa"
  # (https://spdp.gob.ec/wp-json/wp/v2/pages/4844) y separa cada "BOLETÍN
  # DE PRENSA N°..." en un ítem individual. Ver ese script para el detalle;
  # se corre como un paso aparte en el workflow, no a través de este archivo.
