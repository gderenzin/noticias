name: Diario - Noticias de ciberseguridad

# Se dispara solo (cron) una vez al día + se puede lanzar a mano.
on:
  schedule:
    # 11:00 UTC = 06:00 America/Guayaquil (UTC-5; Ecuador no usa horario de
    # verano, así que este offset es fijo todo el año).
    # Si quieres otra hora, cambia el cron de abajo. Formato: min hora dia mes diasemana (UTC).
    # Ejemplos: '0 12 * * *' -> 07:00 Guayaquil | '30 10 * * *' -> 05:30 Guayaquil
    - cron: "0 11 * * *"
  workflow_dispatch: {}

# Permisos mínimos: solo necesitamos poder commitear/pushear al propio repo.
permissions:
  contents: write

# Evita que dos ejecuciones (p.ej. cron + manual casi al mismo tiempo) se pisen.
concurrency:
  group: diario-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install -r requirements.txt

      - name: Descargar y filtrar feeds (fetch_news.py)
        run: python scripts/fetch_news.py

      - name: Boletines de la SPDP (fetch_spdp.py)
        # Fuente aparte: spdp.gob.ec no tiene RSS funcional, así que esto no
        # pasa por feeds.yaml/fetch_news.py -- descarga su endpoint JSON
        # oficial de WordPress y agrega los boletines nuevos a
        # data/nuevas_hoy.json (ver docstring del script). Si el endpoint
        # falla, se salta esta fuente sin romper el workflow.
        run: python scripts/fetch_spdp.py

      - name: Resumir con IA el artículo completo (resumir_ia.py)
        env:
          # Si no existe todavía este secreto, esta variable queda vacía y
          # resumir_ia.py se salta por completo (ver docstring del script):
          # build_site.py cae automáticamente al extracto de RSS de siempre
          # ("Plan B"), nunca falla el proceso por esto.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/resumir_ia.py

      - name: Generar el sitio (build_site.py)
        env:
          # Usada para traducir al español los títulos/resúmenes de fuentes en
          # inglés (ver README: "Traducción de noticias"). Si el secreto no
          # existe todavía, esta variable queda vacía y build_site.py cae en
          # el modo seguro de "citar el original" en vez de fallar.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/build_site.py

      - name: Commitear cambios en main (si los hay)
        id: commit_main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ data/publicadas.json data/imagenes_descargadas.json data/publicadas_spdp.json data/proteccion_datos_recientes.json
          if git diff --cached --quiet; then
            echo "sin_cambios=true" >> "$GITHUB_OUTPUT"
            echo "Sin novedades hoy: no hay cambios que commitear."
          else
            echo "sin_cambios=false" >> "$GITHUB_OUTPUT"
            git commit -m "Actualización automática de noticias - $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Publicar site/ en la rama gh-pages
        if: steps.commit_main.outputs.sin_cambios == 'false'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git worktree add gh-pages-deploy origin/gh-pages
          else
            git worktree add --detach gh-pages-deploy
            (cd gh-pages-deploy && git checkout --orphan gh-pages && git rm -rf . > /dev/null 2>&1 || true)
          fi

          rsync -a --delete --exclude ".git" site/ gh-pages-deploy/

          cd gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar en gh-pages."
          else
            git commit -m "Publicar sitio - $(date -u +%Y-%m-%d)"
            git push origin HEAD:gh-pages
          fi

      - name: Generar afiche de la destacada (generar_afiche.py)
        # Solo tiene sentido si hubo novedades hoy (si no, la portada no
        # cambió y ya se mandó el mismo afiche un día anterior). No inventa
        # nada: lee el título/fuente/imagen/link tal cual quedaron
        # publicados en site/index.html (ver docstring del script).
        if: steps.commit_main.outputs.sin_cambios == 'false'
        run: python scripts/generar_afiche.py

      - name: Enviar el afiche a Telegram (enviar_telegram.py)
        # Paso opcional de notificación (para reenviar a mano al Estado de
        # WhatsApp) -- si no existen los secretos todavía, o si Telegram
        # falla, el script se lo salta con un aviso y nunca hace fallar el
        # workflow (ver README: "Enviar el afiche diario a Telegram").
        if: steps.commit_main.outputs.sin_cambios == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/enviar_telegram.py
