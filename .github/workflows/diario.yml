name: Diario - Noticias de ciberseguridad

# Se dispara solo (cron) cada 4 horas + se puede lanzar a mano. Antes del
# 2026-09-13 corría una sola vez al día (11:00 UTC); con solo 7 fuentes RSS y
# ventana de 48h, una corrida diaria dejaba la edición del día con muy pocas
# noticias si la mayoría de lo nuevo salía después de esa hora (se acumulaba
# recién al día siguiente). Correr cada 4h no trae nada de más -- sigue
# dedupicando contra data/publicadas.json igual que siempre -- solo reparte
# a lo largo del día lo que antes esperaba hasta la corrida de mañana.
on:
  schedule:
    # 6 corridas por día, cada 4h, EN EL MINUTO 17 (no en punto): GitHub avisa
    # en su propia documentación que el minuto 0 de cada hora es el de mayor
    # congestión (todo el mundo programa ahí), así que un cron "en punto"
    # puede demorarse mucho o directamente saltarse una corrida entera bajo
    # carga alta -- justo lo que pasó la primera vez que se probó esto con
    # "0 */4 * * *" (la corrida de las 20:00 UTC del 2026-09-13 nunca
    # apareció en el historial de Actions).
    #
    # Los horarios están corridos a propósito para que una corrida caiga
    # apenas después de la medianoche de Guayaquil (00:17), en vez de horas
    # antes de esa medianoche como pasaba con "*/4" a secas (una corrida a
    # las 23:17 Guayaquil y la siguiente recién a las 03:17). Cada noticia
    # se archiva bajo su fecha de publicación REAL en Guayaquil, no bajo el
    # día de la corrida que la trajo (ver fecha_publicacion_gye() en
    # build_site.py) -- con la corrida vieja, una noticia publicada poco
    # antes de medianoche podía quedar sin buscarse hasta 4h después de
    # cruzado el día, lo que se nota como "noticias de hoy archivadas ayer"
    # en el sitio. Corriendo apenas 17 minutos después de medianoche, ese
    # margen casi desaparece. Horarios (UTC): 01:17, 05:17, 09:17, 13:17,
    # 17:17, 21:17. En America/Guayaquil (UTC-5, sin horario de verano):
    # 20:17 (día anterior), 00:17, 04:17, 08:17, 12:17, 16:17. Formato: min
    # hora dia mes diasemana (UTC).
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch: {}

# Permisos mínimos: solo necesitamos poder commitear/pushear al propio repo.
permissions:
  contents: write

# Evita que dos ejecuciones (p.ej. cron + manual casi al mismo tiempo) se pisen.
concurrency:
  group: diario-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install -r requirements.txt

      - name: Descargar y filtrar feeds (fetch_news.py)
        run: python scripts/fetch_news.py

      - name: Boletines de la SPDP (fetch_spdp.py)
        # Fuente aparte: spdp.gob.ec no tiene RSS funcional, así que esto no
        # pasa por feeds.yaml/fetch_news.py -- descarga su endpoint JSON
        # oficial de WordPress y agrega los boletines nuevos a
        # data/nuevas_hoy.json (ver docstring del script). Si el endpoint
        # falla, se salta esta fuente sin romper el workflow.
        run: python scripts/fetch_spdp.py

      - name: Resumir con IA el artículo completo (resumir_ia.py)
        env:
          # Si no existe todavía este secreto, esta variable queda vacía y
          # resumir_ia.py se salta por completo (ver docstring del script):
          # build_site.py cae automáticamente al extracto de RSS de siempre
          # ("Plan B"), nunca falla el proceso por esto.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/resumir_ia.py

      - name: Generar portadas dinamicas para noticias sin imagen (generar_portadas_fallback.py)
        run: python scripts/generar_portadas_fallback.py

      - name: Generar el sitio (build_site.py)
        env:
          # Usada para traducir al español los títulos/resúmenes de fuentes en
          # inglés (ver README: "Traducción de noticias"). Si el secreto no
          # existe todavía, esta variable queda vacía y build_site.py cae en
          # el modo seguro de "citar el original" en vez de fallar.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/build_site.py

      - name: Commitear cambios en main (si los hay)
        id: commit_main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ data/publicadas.json data/imagenes_descargadas.json data/publicadas_spdp.json data/proteccion_datos_recientes.json
          if git diff --cached --quiet; then
            echo "sin_cambios=true" >> "$GITHUB_OUTPUT"
            echo "Sin novedades hoy: no hay cambios que commitear."
          else
            echo "sin_cambios=false" >> "$GITHUB_OUTPUT"
            git commit -m "Actualización automática de noticias - $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Generar afiches de las noticias nuevas (generar_afiche.py)
        # Un afiche por cada noticia nueva de hoy (data/nuevas_hoy.json --
        # el mismo archivo que ya consumió build_site.py). No inventa
        # nada: lee título/fuente/imagen/link tal cual quedaron publicados
        # en la página de detalle de cada noticia (ver docstring del
        # script). El propio script no hace nada si data/nuevas_hoy.json
        # viene vacío, así que no hace falta condicionarlo a nada más --
        # y tiene que correr ANTES de publicar site/ en gh-pages (paso de
        # abajo) para que sus PNG alcancen a copiarse al sitio, ver el
        # paso siguiente.
        run: python scripts/generar_afiche.py

      - name: Copiar los afiches al sitio para que tengan URL pública
        # Los pasos de Telegram y Facebook mandan el PNG directo (subida
        # de archivo), pero la API de publicación de contenido de
        # Instagram NO acepta subir el archivo: exige una URL pública de
        # la imagen. Por eso, antes de publicar site/ en gh-pages, se
        # copian los afiches nuevos de hoy a site/imagenes/afiches/, para
        # que noticias.derenzin.com/imagenes/afiches/<archivo>.png quede
        # disponible para cuando corra enviar_instagram.py. No afecta a
        # Telegram/Facebook, que siguen usando el PNG local en
        # data/afiches/ como hasta ahora. Si no se generó ningún afiche
        # nuevo en el paso anterior, este paso no copia nada (no es un
        # error).
        run: |
          mkdir -p site/imagenes/afiches
          if compgen -G "data/afiches/*.png" > /dev/null; then
            cp data/afiches/*.png site/imagenes/afiches/
          fi

      - name: Publicar site/ en la rama gh-pages
        # OJO: este paso corre SIEMPRE (no depende de si commit_main encontró
        # noticias nuevas ese día), porque site/ en main puede haber cambiado
        # por otro motivo el mismo día (p.ej. un merge manual de un análisis
        # original vía PR). La comparación real pasa acá abajo: si el site/
        # recién generado (ya con los afiches nuevos copiados adentro) es
        # idéntico al que ya está en gh-pages, este paso no commitea ni
        # pushea nada (ver "publicado" en el output).
        id: publicar_gh_pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git worktree add gh-pages-deploy origin/gh-pages
          else
            git worktree add --detach gh-pages-deploy
            (cd gh-pages-deploy && git checkout --orphan gh-pages && git rm -rf . > /dev/null 2>&1 || true)
          fi
          rsync -a --delete --exclude ".git" site/ gh-pages-deploy/
          cd gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios que publicar en gh-pages."
          else
            git commit -m "Publicar sitio - $(date -u +%Y-%m-%d)"
            git push origin HEAD:gh-pages
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar los afiches a Telegram (enviar_telegram.py)
        # Paso opcional de notificación (para reenviar a mano al Estado de
        # WhatsApp) -- envía TODOS los afiches que dejó generar_afiche.py,
        # uno por noticia nueva. Si no existen los secretos todavía, o si
        # Telegram falla con alguno, el script lo loguea y sigue con los
        # demás sin nunca hacer fallar el workflow (ver README: "Enviar el
        # afiche diario a Telegram").
        if: steps.publicar_gh_pages.outputs.publicado == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/enviar_telegram.py

      - name: Publicar los afiches en Facebook (enviar_facebook.py)
        # Mismo criterio que el paso de Telegram, de arriba: paso opcional
        # de difusión (publica en la Página de Facebook del sitio) -- envía
        # TODOS los afiches que dejó generar_afiche.py, uno por noticia
        # nueva. Si no existen los secretos todavía, o si la Graph API de
        # Meta falla con alguno, el script lo loguea y sigue con los demás
        # sin nunca hacer fallar el workflow (ver README: "Afiche diario y
        # envío a Telegram, Facebook e Instagram").
        if: steps.publicar_gh_pages.outputs.publicado == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/enviar_facebook.py

      - name: Publicar los afiches en Instagram (enviar_instagram.py)
        # Mismo criterio que Telegram y Facebook, de arriba -- pero a
        # diferencia de esos dos, este paso necesita que el afiche YA esté
        # publicado en gh-pages con URL pública (ver el paso "Copiar los
        # afiches al sitio", más arriba), porque la API de Instagram no
        # acepta subir el archivo directo. Reusa el mismo token de la
        # Página de Facebook (debe tener además los permisos
        # instagram_basic e instagram_content_publish -- ver README). Si
        # no existen los secretos todavía, o si la Graph API falla con
        # alguno, el script lo loguea y sigue sin hacer fallar el workflow.
        if: steps.publicar_gh_pages.outputs.publicado == 'true'
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/enviar_instagram.py
