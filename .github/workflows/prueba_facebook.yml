name: Prueba puntual - Publicar en Facebook

# Workflow SOLO manual (no tiene "schedule"), pensado para probar el envío
# a Facebook (scripts/enviar_facebook.py) sin esperar a que haya noticias
# nuevas ni depender del flujo diario completo. Publica UNA imagen (ya
# alojada en una URL pública, p.ej. una foto real de una noticia ya
# publicada en el sitio) con el título y link que le pases, usando los
# mismos secretos FACEBOOK_PAGE_ID / FACEBOOK_PAGE_ACCESS_TOKEN del
# workflow diario -- ver README ("Afiche diario y envío a Telegram y
# Facebook") para cómo se obtuvieron.
#
# Para lanzarlo: pestaña "Actions" del repo -> "Prueba puntual - Publicar
# en Facebook" -> "Run workflow", completar los 3 campos y confirmar.

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título de la noticia (va en el caption de la publicación)"
        required: true
        type: string
      link:
        description: "Link completo a la noticia en noticias.derenzin.com"
        required: true
        type: string
      imagen_url:
        description: "URL pública de la imagen a publicar (p.ej. una imagen real ya alojada en el sitio)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publicar_prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publicar la imagen de prueba (enviar_facebook.py --url)
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python scripts/enviar_facebook.py \
            --url "${{ inputs.imagen_url }}" \
            --titulo "${{ inputs.titulo }}" \
            --link "${{ inputs.link }}"
