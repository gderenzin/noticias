name: Reprocesar resumen con IA (backfill general)

# Workflow SOLO manual (no tiene "schedule"), de uso puntual: corre
# scripts/reprocesar_ia_general.py sobre TODAS las páginas de detalle ya
# publicadas en site/noticia/, reintenta el resumen con IA (Gemini) para las
# que cayeron en el "Plan B" (extracto corto de RSS en vez del resumen
# ampliado de 3-4 párrafos), y republica el sitio.
#
# Por qué existe (2026-09-17): el resumen con IA viene fallando cada vez más
# seguido con el volumen actual de noticias/día (6% de las noticias del
# 14/09 sin resumen de IA -> 54% el 17/09, por conteo de párrafos
# publicados) -- ver el cambio de modelo a gemini-3.5-flash en
# resumir_ia.py. Este workflow es el backfill para las que ya quedaron
# publicadas en Plan B mientras tanto.
#
# Respeta la cuota de Gemini: procesa como mucho "limite" ítems por corrida
# (default: 40) y lleva un ledger en
# data/reprocesar_ia_general_estado.json para no repetir en la próxima
# corrida los que ya se arreglaron ni gastar otra llamada en los que ya
# fallaron. Hay que volver a correr este workflow (una corrida por lote)
# hasta que el log diga "0 candidato(s) pendiente(s)".
#
# Para lanzarlo: pestaña "Actions" del repo -> "Reprocesar resumen con IA
# (backfill general)" -> "Run workflow". El campo "limite" es opcional
# (vacío = 40). Marcar "reintentar_fallidos" únicamente en una corrida
# posterior, para reintentar los que fallaron antes (p.ej. si fallaron por
# un error transitorio, no porque la fuente en sí no tenga más contenido).

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de noticias a reprocesar en esta corrida (vacío = 40)"
        required: false
        type: string
      reintentar_fallidos:
        description: "Reintentar también los ítems que fallaron en una corrida anterior"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reprocesar_ia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (incluye trafilatura)
        run: pip install -r requirements.txt

      - name: Reprocesar candidatos (reprocesar_ia_general.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/reprocesar_ia_general.py \
            ${{ inputs.limite && format('--limite {0}', inputs.limite) || '' }} \
            ${{ inputs.reintentar_fallidos == 'true' && '--reintentar-fallidos' || '' }}

      - name: Commitear el cambio en main (si lo hay)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ data/reprocesar_ia_general_estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear (ningún ítem se pudo reprocesar en esta corrida)."
          else
            git commit -m "Reprocesar resumen con IA de noticias ya publicadas (backfill general)"
            git push
          fi

      - name: Publicar site/ en la rama gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git worktree add gh-pages-deploy origin/gh-pages
          else
            git worktree add --detach gh-pages-deploy
            (cd gh-pages-deploy && git checkout --orphan gh-pages && git rm -rf . > /dev/null 2>&1 || true)
          fi
          rsync -a --delete --exclude ".git" site/ gh-pages-deploy/
          cd gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar en gh-pages."
          else
            git commit -m "Reprocesar resumen con IA - $(date -u +%Y-%m-%d)"
            git push origin HEAD:gh-pages
          fi
